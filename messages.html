<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - StudyLink</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-graduation-cap"></i>
                StudyLink
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="find-tutor.html" class="nav-link">Find a Tutor</a></li>
                <li><a href="tutor-profile.html" class="nav-link">Become a Tutor</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="login.html" class="nav-link">Login</a></li>
                <li><a href="register.html" class="nav-link">Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header py-4 bg-light">
        <div class="container">
            <h1><i class="fas fa-comments me-2"></i>Messages</h1>
        </div>
    </header>

    <!-- Main Content -->
    <section class="messages-section py-4">
        <div class="container">
            <div class="row">
                <!-- Conversations List -->
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5>Conversations</h5>
                        </div>
                        <div class="card-body">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="Search conversations...">
                                <button class="btn btn-outline-secondary" type="button"><i class="fas fa-search"></i></button>
                            </div>
                            <div id="conversations-list">
                                <!-- Conversations will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="col-md-8">
                    <div id="messages-area">
                        <!-- Messages will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer mt-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-3 col-sm-6>
                    <h3>StudyLink</h3>
                    <p>A peer tutoring platform designed for CSU students to connect, learn, and succeed together.</p>
                </div>
                <div class="col-md-3 col-sm-6>
                    <h3>Quick Links</h3>
                    <ul class="footer-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="find-tutor.html">Find a Tutor</a></li>
                        <li><a href="tutor-profile.html">Become a Tutor</a></li>
                        <li><a href="about.html">About</a></li>
                    </ul>
                </div>
                <div class="col-md-3 col-sm-6>
                    <h3>Support</h3>
                    <ul class="footer-links">
                        <li><a href="#">Help Center</a></li>
                        <li><a href="#">Terms of Service</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                    </ul>
                </div>
                <div class="col-md-3 col-sm-6>
                    <h3>Follow Us</h3>
                    <div class="social-icons">
                        <a href="#" class="text-me-2"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="text-me-2"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-me-2"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4 pt-3 border-top">
                <p>&copy; 2026 StudyLink. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/mock-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load messages interface
            loadConversations();
            loadMessagesArea();
        });

        function loadConversations() {
            const conversationsList = document.getElementById('conversations-list');
            if (!conversationsList) return;

            // Mock conversations data
            conversationsList.innerHTML = '';

            mockConversations.forEach(conversation => {
                const conversationElement = document.createElement('div');
                conversationElement.className = `d-flex justify-content-between align-items-center p-3 border-bottom ${conversation.unread ? 'fw-bold bg-light' : ''}`;
                conversationElement.innerHTML = `
                    <div class="d-flex align-items-start">
                        <div class="flex-shrink-0">
                            <img src="${conversation.tutorAvatar}" alt="${conversation.tutorName}" class="rounded-circle" width="40" height="40">
                        </div>
                        <div class="flex-grow-1 ms-2">
                            <h6 class="mb-1">${conversation.tutorName}</h6>
                            <p class="mb-1 text-truncate">${conversation.lastMessage}</p>
                            <small class="text-muted">${conversation.timestamp}</small>
                        </div>
                    </div>
                    ${conversation.unread ? '<span class="badge bg-primary rounded-pill">' + conversation.unread + '</span>' : ''}
                `;

                // Add click event to load messages for this conversation
                conversationElement.addEventListener('click', function() {
                    // Mark as read (remove unread status)
                    this.classList.remove('fw-bold', 'bg-light');
                    const badge = this.querySelector('.badge');
                    if (badge) badge.remove();

                    // Update active conversation
                    document.querySelectorAll('#conversations-list > div').forEach(div => {
                        div.classList.remove('active');
                    });
                    this.classList.add('active');

                    // Load messages for this conversation
                    loadMessagesForConversation(conversation.id);
                });

                conversationsList.appendChild(conversationElement);
            });

            // Set first conversation as active by default
            if (mockConversations.length > 0) {
                const firstConversation = conversationsList.firstElementChild;
                if (firstConversation) {
                    firstConversation.classList.add('active');
                    loadMessagesForConversation(mockConversations[0].id);
                }
            }
        }

        function loadMessagesArea() {
            const messagesArea = document.getElementById('messages-area');
            if (!messagesArea) return;

            messagesArea.innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-comment-slash fa-3x mb-3 text-muted"></i>
                    <p class="text-muted">Select a conversation to view messages</p>
                </div>
            `;
        }

        function loadMessagesForConversation(conversationId) {
            const messagesArea = document.getElementById('messages-area');
            if (!messagesArea) return;

            // Get conversation details
            const conversation = mockConversations.find(c => c.id === conversationId);
            if (!conversation) return;

            // Get messages for this conversation
            const messages = mockMessages[conversationId] || [];

            messagesArea.innerHTML = `
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img src="${conversation.tutorAvatar}" alt="${conversation.tutorName}" class="rounded-circle me-3" width="40" height="40">
                            <div>
                                <h5 class="mb-0">${conversation.tutorName}</h5>
                                <p class="text-muted mb-0">Online</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-body" id="messages-container">
                        <!-- Messages will be loaded here -->
                    </div>
                    <div class="card-footer">
                        <form id="message-form" data-mock-submit>
                            <div class="input-group">
                                <input type="text" class="form-control" id="message-input" placeholder="Type a message..." aria-label="Type a message" aria-describedby="button-addon2">
                                <button class="btn btn-outline-secondary" type="submit" id="button-addon2"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            // Load actual messages
            loadMessages(messages);

            // Handle message form submission
            const messageForm = document.getElementById('message-form');
            if (messageForm) {
                messageForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    const messageInput = document.getElementById('message-input');
                    const messageText = messageInput.value.trim();

                    if (messageText) {
                        // Add message to UI (mock)
                        addMessageToUI(messageText, 'student');

                        // Clear input
                        messageInput.value = '';

                        // Simulate sending message
                        setTimeout(() => {
                            // Add mock response
                            addMessageToUI("Thanks for your message! How can I help you today?", 'tutor');
                        }, 1000);
                    }
                });
            }
        }

        function loadMessages(messages) {
            const messagesContainer = document.getElementById('messages-container');
            if (!messagesContainer) return;

            messagesContainer.innerHTML = '';

            if (messages.length === 0) {
                messagesContainer.innerHTML = '<p class="text-center text-muted py-3">No messages yet. Start the conversation!</p>';
                return;
            }

            messages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `d-flex mb-3 ${message.sender === 'student' ? 'justify-content-end' : 'justify-content-start'}`;

                if (message.sender === 'student') {
                    messageElement.innerHTML = `
                        <div>
                            <div class="bg-primary text-white rounded-pill px-3 py-2 mb-1">
                                <p class="mb-0">${message.message}</p>
                            </div>
                            <small class="text-muted">${message.timestamp}</small>
                        </div>
                    `;
                } else {
                    messageElement.innerHTML = `
                        <div>
                            <img src="https://via.placeholder.com/30x30?text=👩‍🏫" alt="Tutor" class="rounded-circle me-2" width="30" height="30">
                            <div class="bg-light rounded-pill px-3 py-2 mb-1">
                                <p class="mb-0">${message.message}</p>
                            </div>
                            <small class="text-muted">${message.timestamp}</small>
                        </div>
                    `;
                }

                messagesContainer.appendChild(messageElement);
            });

            // Scroll to bottom
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }

        function addMessageToUI(messageText, sender) {
            const messagesContainer = document.getElementById('messages-container');
            if (!messagesContainer) return;

            const messageElement = document.createElement('div');
            messageElement.className = `d-flex mb-3 ${sender === 'student' ? 'justify-content-end' : 'justify-content-start'}`;

            if (sender === 'student') {
                messageElement.innerHTML = `
                    <div>
                        <div class="bg-primary text-white rounded-pill px-3 py-2 mb-1">
                            <p class="mb-0">${messageText}</p>
                        </div>
                        <small class="text-muted">Just now</small>
                    </div>
                `;
            } else {
                messageElement.innerHTML = `
                    <div>
                        <img src="https://via.placeholder.com/30x30?text=👩‍🏫" alt="Tutor" class="rounded-circle me-2" width="30" height="30">
                        <div class="bg-light rounded-pill px-3 py-2 mb-1">
                            <p class="mb-0">${messageText}</p>
                        </div>
                        <small class="text-muted">Just now</small>
                    </div>
                `;
            }

            messagesContainer.appendChild(messageElement);

            // Scroll to bottom
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }
    </script>
</body>
</html>
